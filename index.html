<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gloom Contest 2027</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #lector {
      width: 100%;
      max-width: 420px;
      margin: 20px auto;
    }

    button {
      background: white;
      color: black;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #resultado {
      padding: 20px;
      font-size: 18px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <h1>GLOOM CONTEST 2027</h1>
  <h2>Escáner de entradas</h2>

  <button onclick="abrirCamara()">
    📷 Abrir cámara
  </button>

  <div id="lector"></div>
  <div id="resultado">Esperando cámara...</div>

  <script>
    let lector;

    async function abrirCamara() {
      const resultado = document.getElementById("resultado");

      try {
        resultado.textContent = "Iniciando cámara...";

        const camaras = await Html5Qrcode.getCameras();

const opcion = prompt(
  camaras.map((c, i) => i + ": " + c.label).join("\n"),
  "0"
);

if (opcion === null) return;

const camara = camaras[Number(opcion)];
if (!camara) throw new Error("Cámara inválida");

lector = new Html5Qrcode("lector");

        await lector.start(
        camara.id,
          { fps: 10 },
          function(texto) {
          lector.pause();
resultado.textContent = "Verificando: " + texto;

window.location.href =
  "https://script.google.com/macros/s/AKfycbwtQfo1oVyfKJEfQbUXVmGv-b8cR85FQz8b0wveDcPBtJQoy1dCEAG7EzAJ7AJEgdX-hA/exec?codigo="
  + encodeURIComponent(texto);
          },
          function() {}
        );

        resultado.textContent = "Cámara lista";
      } catch (error) {
        resultado.textContent = "Error: " + error;
      }
    }
  </script>

</body>
</html>
